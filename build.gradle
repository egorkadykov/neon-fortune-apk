buildscript {
    repositories {
        // Зеркало Maven Central от Google: основной репозиторий иногда отдаёт 429.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

allprojects {
    repositories {
        // Зеркало Maven Central от Google: основной репозиторий иногда отдаёт 429.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
