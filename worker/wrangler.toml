name = "neon-fortune-api"
main = "src/index.js"
compatibility_date = "2026-11-27"
workers_dev = true

[[durable_objects.bindings]]
name = "STATE"
class_name = "FortuneState2"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FortuneState"]

# Миграция переименования уже применена. Повторное объявление заставляло
# Cloudflare пересоздавать объект и терять хэши паролей при каждом деплое.
# Класс FortuneState2 зафиксирован в binding выше, storage сохраняется.

# Лимиты на границе Cloudflare: отсекают флуд до попадания в Durable Object.
[[ratelimits]]
name = "API_GUARD"
namespace_id = "710001"

  [ratelimits.simple]
  limit = 600
  period = 60

[[ratelimits]]
name = "AUTH_GUARD"
namespace_id = "710002"

  [ratelimits.simple]
  limit = 12
  period = 60
