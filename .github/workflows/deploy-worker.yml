name: Deploy Neon Fortune API

on:
  workflow_dispatch:
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.NEON_API_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          EGOR_HASH: ${{ secrets.NEON_EGOR_HASH }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | npx --yes wrangler@4 secret put GITHUB_TOKEN --name neon-fortune-api
          printf '%s' "$ADMIN_TOKEN" | npx --yes wrangler@4 secret put ADMIN_TOKEN --name neon-fortune-api
          printf '%s' "$EGOR_HASH" | npx --yes wrangler@4 secret put NEON_EGOR_HASH --name neon-fortune-api
          npx --yes wrangler@4 deploy --config worker/wrangler.toml
