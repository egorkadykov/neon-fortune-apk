name: Build Neon Fortune APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Inject online token into assets
        env:
          NEON_GITHUB_TOKEN: ${{ secrets.NEON_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          token = os.environ['NEON_GITHUB_TOKEN']
          js_path = pathlib.Path('neon-online-api.js')
          js = js_path.read_text(encoding='utf-8')
          js = js.replace('window.NEON_GITHUB_TOKEN', repr(token))
          target = pathlib.Path('app/src/main/assets/neon-online-api.js')
          target.write_text(js, encoding='utf-8')
          PY

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-fortune-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
