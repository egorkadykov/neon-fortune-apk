name: Build Neon Fortune APK

# Только main: релиз создаёт тег, и сборка не должна запускать сама себя.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_CODE: ${{ vars.APP_VERSION_CODE || '2' }}
  APP_VERSION_NAME: ${{ vars.APP_VERSION_NAME || '1.1' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Один и тот же ключ на всех сборках: только так Android разрешает
      # доустановить новую версию прямо из приложения.
      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          test -n "$SIGNING_KEYSTORE"
          printf '%s' "$SIGNING_KEYSTORE" | base64 -d > app/neon.jks

      - name: Inject server URL into assets
        env:
          NEON_API_BASE: ${{ vars.NEON_API_BASE }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          base = os.environ.get('NEON_API_BASE', '').strip()
          js_path = pathlib.Path('neon-online-api.js')
          js = js_path.read_text(encoding='utf-8')
          js = js.replace('window.NEON_API_BASE', repr(base))
          target = pathlib.Path('app/src/main/assets/neon-online-api.js')
          target.write_text(js, encoding='utf-8')
          PY

      - name: Build debug APK
        run: |
          for attempt in 1 2 3; do
            if gradle assembleDebug --no-daemon; then exit 0; fi
            echo "Сборка прервалась, повтор $attempt из 3..."
            sleep 30
          done
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-fortune-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Свежий релиз — источник для плашки обновления внутри игры.
      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk NeonFortune.apk

      - name: Publish in-app update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_CODE }}
          name: Neon Fortune ${{ env.APP_VERSION_NAME }}
          body: Обновление приложения. Ставится прямо из игры.
          files: NeonFortune.apk
          overwrite_files: true
